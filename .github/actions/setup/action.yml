name: Setup
description: >
  Creates the virtual environment and installs the Conan dependencies of a dev.py configuration,
  restoring and saving the Conan cache between runs. Expects the repository to be checked out.

inputs:
  config:
    description: dev.py configuration to install, e.g. lnx-gcc-release
    required: true

runs:
  using: composite
  steps:
    - name: Install System Prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-11 g++-11 python3-venv

    # On Windows, also checks for Visual Studio 2022 with the C++ and Clang components, and
    # installs the missing ones. Once .venv is on the PATH, `python` is the venv's on every OS.
    - name: Setup Virtual Environment
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          python dev.py setup
          echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
        else
          python3 dev.py setup
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        fi

    # The runner image (e.g. ubuntu26, win22) goes in the cache key: binaries built on one image
    # are not reused on another
    - name: Get Runner Image
      id: runner-image
      shell: bash
      run: echo "name=${ImageOS:-$RUNNER_OS}" >> "$GITHUB_OUTPUT"

    - name: Restore Conan Cache
      id: conan-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.conan2
        # conan.lock pins every revision, including local recipes. conanfile.py (dependency
        # options) and profiles (settings) also change the binaries, but not the lockfile.
        key: ${{ steps.runner-image.outputs.name }}-${{ inputs.config }}-conan-${{ hashFiles('requirements.txt', 'conan.lock', 'conanfile.py', 'profiles/**') }}
        restore-keys: |
          ${{ steps.runner-image.outputs.name }}-${{ inputs.config }}-conan-
          ${{ steps.runner-image.outputs.name }}-

    - name: Install Dependencies
      shell: bash
      run: python dev.py install ${{ inputs.config }}

    - name: Conan Prune Cache # drop recipes and binaries this run didn't use (old revisions)
      if: steps.conan-cache-restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        conan remove "*:*" --lru=1d --confirm
        conan remove "*" --lru=1d --confirm

    - name: Conan Clean Cache # clean the Conan cache before saving it to reduce its size
      if: steps.conan-cache-restore.outputs.cache-hit != 'true'
      shell: bash
      run: conan cache clean

    - name: Save Conan Cache
      if: steps.conan-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.conan2
        key: ${{ steps.conan-cache-restore.outputs.cache-primary-key }}
