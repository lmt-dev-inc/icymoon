name: CMake on multiple platforms

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations.
      # Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-26.04]
        # dev.py configuration, also used as the CMake and CTest preset name
        config: [gcc-release]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install System Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11 python3-venv

      - name: Setup Virtual Environment
        working-directory: ${{ github.workspace }}
        run: |
          python3 dev.py setup
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Restore Conan Cache
        id: conan-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          # conan.lock pins every revision, including local recipes. conanfile.py (dependency
          # options) and profiles (settings) also change the binaries, but not the lockfile.
          key: ${{ matrix.os }}-conan-${{ hashFiles('conan.lock', 'conanfile.py', 'profiles/**') }}
          restore-keys: |
            ${{ matrix.os }}-conan-

      - name: Install Dependencies
        working-directory: ${{ github.workspace }}
        run: python3 dev.py install ${{ matrix.config }}

      - name: Conan Clean Cache # clean the Conan cache before saving it to reduce its size
        if: steps.conan-cache-restore.outputs.cache-hit != 'true'
        run: conan cache clean

      - name: Save Conan Cache
        if: steps.conan-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: ${{ steps.conan-cache-restore.outputs.cache-primary-key }}

      - name: Configure CMake
        working-directory: ${{ github.workspace }}
        run: cmake --preset ${{ matrix.config }}

      - name: Build
        working-directory: ${{ github.workspace }}
        run: cmake --build --preset ${{ matrix.config }} --parallel

      - name: Unit Tests
        working-directory: ${{ github.workspace }}
        run: ctest --preset ${{ matrix.config }} -L "unit_test" -j 10
